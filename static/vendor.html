<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Operator — Vendor Portal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fa;
      color: #182230;
      margin: 0;
      padding: 40px 20px;
    }

    main {
      max-width: 680px;
      margin: auto;
    }

    form, section {
      background: white;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 16px;
      font-weight: 600;
    }

    input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #aeb9c8;
      border-radius: 6px;
      font: inherit;
    }

    button {
      background: #2457db;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    dt {
      font-weight: 600;
      margin-top: 16px;
    }

    dd {
      margin: 5px 0 0;
      overflow-wrap: anywhere;
    }

    #status {
      min-height: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vendor Portal</h1>
    <p>Inspect a vendor record saved by Company Operator.</p>

    <form id="lookup-form">
      <label>
        Organization ID
        <input
          id="organization-id"
          value="demo-company"
          required
        >
      </label>

      <label>
        Vendor ID
        <input id="vendor-id" required>
      </label>

      <button id="lookup-button" type="submit">
        Find vendor
      </button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="vendor-result" hidden>
      <h2>Saved vendor record</h2>
      <dl id="vendor-fields"></dl>
    </section>
  </main>

  <script>
    const form = document.querySelector("#lookup-form");
    const button = document.querySelector("#lookup-button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#vendor-result");
    const fields = document.querySelector("#vendor-fields");

    const labels = {
      id: "Vendor ID",
      organization_id: "Organization",
      legal_name: "Legal name",
      contact_email: "Contact email",
      registered_address: "Registered address",
      service_category: "Service category",
      created_at: "Created at (UTC)"
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const organizationId = document
        .querySelector("#organization-id").value.trim();
      const vendorId = document
        .querySelector("#vendor-id").value.trim();

      result.hidden = true;
      fields.replaceChildren();

      if (!organizationId || !vendorId) {
        status.textContent = "Enter both IDs.";
        return;
      }

      button.disabled = true;
      status.textContent = "Loading vendor…";

      try {
        const url =
          "/organizations/" + encodeURIComponent(organizationId) +
          "/vendors/" + encodeURIComponent(vendorId);

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (response.status === 404) {
          status.textContent =
            "Vendor not found for this organization.";
          return;
        }

        if (!response.ok) {
          throw new Error("Request failed: HTTP " + response.status);
        }

        const vendor = await response.json();

        for (const [key, label] of Object.entries(labels)) {
          const term = document.createElement("dt");
          term.textContent = label;

          const value = document.createElement("dd");
          value.textContent = vendor[key] ?? "—";
          value.dataset.field = key;

          fields.append(term, value);
        }

        result.hidden = false;
        status.textContent = "Vendor record loaded.";
      } catch (error) {
        status.textContent =
          "Could not load the vendor. Check the server and try again.";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
